<template>
  <lightning-card title="MAQCARE Reports">
    <div class="slds-p-horizontal_medium">
      <lightning-textarea
        label="Describe the problem"
        value={description}
        onchange={handleChange}
      ></lightning-textarea>
      <lightning-button
        label="File a report"
        variant="brand"
        onclick={handleSubmit}
      ></lightning-button>

      <template for:each={reports} for:item="report">
        <p key={report.Id} class="slds-m-top_small">
          <b>{report.Name}</b> - {report.Description__c} -
          Hours left: {report.Hours_Left__c}
        </p>
      </template>
    </div>
  </lightning-card>
</template>
