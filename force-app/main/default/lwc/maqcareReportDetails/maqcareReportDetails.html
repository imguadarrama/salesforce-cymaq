<template>
  <div class="slds-box slds-p-around_medium">
    <div
      class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start"
    >
      <div>
        <h2>Report number:</h2>
        <p class="slds-m-top_xx-small">{report.Name}</p>
      </div>
      <lightning-badge label="Technician requested"></lightning-badge>
    </div>

    <div class="slds-m-top_medium">
      <p>Description:</p>
      <p class="slds-m-top_xx-small">{report.Description__c}</p>
    </div>

    <div
      class="slds-grid slds-grid_vertical-align-center slds-m-top_medium slds-p-top_medium slds-border_top"
    >
      <lightning-icon
        icon-name="utility:clock"
        size="x-small"
        class="slds-m-right_small"
      ></lightning-icon>
      <p>{arrivalMessage}</p>
    </div>
  </div>

  <div class="slds-clearfix slds-m-top_small">
    <lightning-button
      class="slds-float_right"
      label="Cancel report"
      variant="destructive-text"
      onclick={handleCancel}
    ></lightning-button>
  </div>
</template>
